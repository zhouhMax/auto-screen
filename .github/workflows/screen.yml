name: 每日选股推送

on:
  schedule:
    # GitHub cron 使用 UTC；北京时间 = UTC+8
    # 提前 10 分钟触发，脚本内部等到 09:25:05 / 14:40:30 / 15:40:30 再抓数据
    - cron: "15 1 * * 1-5"    # 09:15 -> 等待 09:25 竞价
    - cron: "35 6 * * 1-5"    # 14:35 -> 等待 14:40 尾盘
    - cron: "35 7 * * 1-5"    # 15:35 -> 等待 15:40 盘后
  workflow_dispatch:
    inputs:
      slot:
        description: "手动运行时选择时段"
        required: true
        default: "close"
        type: choice
        options: [auction, tail, close]

concurrency:
  group: screen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复历史数据缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hist.parquet
            data/basic.parquet
            data/meta.json
          key: hist-${{ github.run_id }}
          restore-keys: |
            hist-

      - name: 检查缓存
        run: |
          python - <<'PY'
          import os, json
          print("hist.parquet:", os.path.exists("data/hist.parquet"))
          if os.path.exists("data/meta.json"):
              print(json.load(open("data/meta.json", encoding="utf-8")))
          PY

      - name: 运行选股并推送
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
        run: python main.py --slot "${{ github.event.inputs.slot || 'auto' }}" --json-out

      - name: 提交结果到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results
          git diff --cached --quiet || git commit -m "选股结果 $(date -u +'%Y%m%d %H:%M') UTC"
          git push
